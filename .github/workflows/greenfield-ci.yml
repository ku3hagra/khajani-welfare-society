name: Greenfield CI

on:
  push:
    branches: [greenfield-v0.8]
  pull_request:
    branches: [greenfield-v0.8]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://khajaniwelfaresociety.com
